# alembic/alembic.ini
# Alembic configuration for StellarFlow Backend (#DB-Migration)
#
# The sqlalchemy.url value below is a placeholder; the real URL is read from
# the DATABASE_URL environment variable inside alembic/env.py so that secrets
# are never committed to source control.
#
# Run migrations:
#   alembic -c alembic/alembic.ini upgrade head
#
# Roll back one step:
#   alembic -c alembic/alembic.ini downgrade -1

[alembic]
# Path to the migration scripts directory, relative to this config file.
script_location = %(here)s

# Placeholder — overridden at runtime by env.py reading DATABASE_URL.
sqlalchemy.url = postgresql://user:pass@localhost/stellarflow

# Jinja2 template file for auto-generated migration scripts.
file_template = %%(rev)s_%%(slug)s

# Timezone used in migration file headers.
timezone = UTC

# Maximum number of revision files to consider when searching for a
# "base" (prevents runaway searches in large histories).
truncate_slug_length = 40

# Output encoding for generated .py files.
output_encoding = utf-8


# ---------------------------------------------------------------------------
# Logging configuration (stdlib logging.config.fileConfig format)
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
