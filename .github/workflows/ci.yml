name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: stellarflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/stellarflow
      STELLAR_SECRET: SDON4BI7DPYRITW7QBJMJ6KOESXAVIYPUXBDDTIEDDN4TTN6YHQTF7QA
      SIGNER_BACKEND: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python migration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alembic sqlalchemy pytest psycopg2-binary asyncpg pydantic pydantic-settings

      - name: Validate database migration governance rules
        run: python scripts/validate_migrations.py

      - name: Run Alembic migration validation suite (upgrade head -> downgrade base -> upgrade head)
        run: |
          alembic -c alembic/alembic.ini upgrade head
          alembic -c alembic/alembic.ini downgrade base
          alembic -c alembic/alembic.ini upgrade head

      - name: Detect uncommitted schema changes & run migration rollback test suite
        run: |
          python scripts/validate_migrations.py --check-drift
          python -m pytest tests/test_alembic_migrations.py -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run build

      - name: Unit tests
        run: |
          npx tsx test/stroops.test.ts
          npx tsx test/ghsFetcher.test.ts
          npx tsx test/ngnFetcher.test.ts
          npx tsx test/sorobanEventListener.test.ts
          npx tsx test/circuitBreakerService.test.ts
