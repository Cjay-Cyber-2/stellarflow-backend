name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/stellarflow
      STELLAR_SECRET: SDON4BI7DPYRITW7QBJMJ6KOESXAVIYPUXBDDTIEDDN4TTN6YHQTF7QA
      SIGNER_BACKEND: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run build

      - name: Unit tests
        run: |
          npx tsx test/stroops.test.ts
          npx tsx test/ghsFetcher.test.ts
          npx tsx test/ngnFetcher.test.ts
          npx tsx test/sorobanEventListener.test.ts

  openapi-contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FastAPI schema tooling
        run: pip install fastapi openapi-spec-validator
      - name: Check OpenAPI artifact and compatibility
        run: python scripts/check_openapi.py --check
